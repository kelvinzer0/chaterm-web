<!doctype html>
<html class="theme-dark">
  <head>
    <meta charset="UTF-8" />
    <title>Chaterm</title>
    <script>
      ;(function () {
        const getSystemTheme = () => {
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            return 'dark'
          }
          return 'light'
        }

        const actualTheme = getSystemTheme()
        document.documentElement.className = `theme-${actualTheme}`
      })()
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/renderer/src/api/web-bridge-init.ts"></script>
    <script type="module" src="/src/renderer/src/main.ts"></script>
  </body>
</html>
